[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cropheight"
version = "0.1.0"
description = "Crop height SAR modeling pipeline"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "mlflow>=2.12",
  "shap>=0.45",
  "seaborn>=0.13",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "statsmodels>=0.14",
  "joblib>=1.3",
  "optuna>=3.0",
  "openpyxl>=3.1",
  "streamlit>=1.52",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]